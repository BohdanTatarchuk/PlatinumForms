<div class="container">
  <h2>Join test</h2>
  <p>When you create a new test, it gets its own unique code, called the Test ID. If you want to join someone else's test, ask them for a Test ID!</p>
  <input type="text" id="code" name="code" placeholder="type your invitation code here!" [(ngModel)]="code" required>
  <input type="submit" id="start" value="Join" (click)="joinTest()">
</div>
