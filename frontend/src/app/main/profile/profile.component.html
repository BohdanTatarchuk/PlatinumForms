<div class="container">
  @if(username) {
    <h2>Hello, {{ username }}! How is it going?</h2>
  } @else {
    <h2>Hello! How is it going?</h2>
  }
  <h4>Current email: {{ email }} </h4>
  <input type="submit"
         id="goToProfile"
         (click)="navigate_to_profile()"
          value="Change profile">
</div>
