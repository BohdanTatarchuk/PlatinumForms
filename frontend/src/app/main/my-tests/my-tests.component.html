<div class="rectangle">
  <h2>My tests</h2>
  <div id="testsList">
    @for (test of tests; track test.id) {
      <app-my-test [test]="test" (select)="onSelectTest($event)"/>
    }
  </div>

  <input type="submit" id="start" value="Create new test" (click)="onSelectNewTest()">

  <h3>{{ errorMaxAmount }}</h3>
</div>
